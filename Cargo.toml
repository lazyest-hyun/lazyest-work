[workspace]
members = [
  "crates/gws-core",
  "crates/gws-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/hyunn515/gws-menu-app"

[workspace.dependencies]
anyhow = "1.0.99"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
